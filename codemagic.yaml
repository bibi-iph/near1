# Codemagic — облачная сборка Near под Android.
#
# Что делает сборка помимо обычного `cap add android`:
#   1) прописывает разрешения Health Connect (включая сон и кислород, которых
#      раньше не было) и разрешения для непрерывной фоновой геолокации;
#   2) чинит два бага в чужом плагине capacitor-health;
#   3) вкладывает наши нативные исходники из native/android/ — фоновую службу
#      геолокации и расширенное чтение Health Connect;
#   4) регистрирует оба наших плагина в MainActivity.
#
# Исходники лежат обычными .kt файлами в репозитории (native/android/),
# их можно читать и править — раньше они были зашиты в base64.

definitions:
  scripts:
    - &install_deps
      name: Установить зависимости
      script: |
        npm install
        # Гарантируем наличие плагинов, даже если package.json в репозитории устарел
        npm install capacitor-health@^7.1.0 @capacitor/geolocation@^7.0.0 --save
        echo "--- зависимости после установки ---"
        node -e "const p=require('./package.json'); console.log(JSON.stringify(p.dependencies,null,1));"
        test -d node_modules/capacitor-health || { echo 'ОШИБКА: плагин браслета не установился'; exit 1; }
        test -d native/android || { echo 'ОШИБКА: нет папки native/android с нашими исходниками'; exit 1; }
        echo "плагин браслета и наши исходники на месте"

    - &add_android
      name: Добавить платформу Android
      script: npx cap add android || true

    - &patch_android
      name: Разрешения, версии инструментов и правки чужого плагина
      script: |
        python3 - <<'PY'
        import re, io, glob

        # ---------- 1) AndroidManifest.xml ----------
        mpath = "android/app/src/main/AndroidManifest.xml"
        m = io.open(mpath, encoding="utf-8").read()

        COMPONENTS = '''
            <!-- near:components -->
            <activity
                android:name="com.fit_up.health.capacitor.PermissionsRationaleActivity"
                android:exported="true">
                <intent-filter>
                    <action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE" />
                </intent-filter>
            </activity>
            <activity-alias
                android:name="ViewPermissionUsageActivity"
                android:exported="true"
                android:targetActivity="com.fit_up.health.capacitor.PermissionsRationaleActivity"
                android:permission="android.permission.START_VIEW_PERMISSION_USAGE">
                <intent-filter>
                    <action android:name="android.intent.action.VIEW_PERMISSION_USAGE" />
                    <category android:name="android.intent.category.HEALTH_PERMISSIONS" />
                </intent-filter>
            </activity-alias>

            <!-- Непрерывное отслеживание: служба с постоянным уведомлением.
                 stopWithTask=false — слежение продолжается, даже если приложение
                 смахнули из списка запущенных. -->
            <service
                android:name="com.fit_up.health.capacitor.NearGeoService"
                android:enabled="true"
                android:exported="false"
                android:stopWithTask="false"
                android:foregroundServiceType="location" />

            <!-- Возобновление слежения после перезагрузки телефона -->
            <receiver
                android:name="com.fit_up.health.capacitor.NearBootReceiver"
                android:enabled="true"
                android:exported="true">
                <intent-filter>
                    <action android:name="android.intent.action.BOOT_COMPLETED" />
                    <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                    <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                </intent-filter>
            </receiver>
        '''

        PERMISSIONS = '''
            <!-- near:permissions -->
            <queries>
                <package android:name="com.google.android.apps.healthdata" />
            </queries>

            <!-- фитнес-браслет через Health Connect -->
            <uses-permission android:name="android.permission.health.READ_STEPS" />
            <uses-permission android:name="android.permission.health.READ_ACTIVE_CALORIES_BURNED" />
            <uses-permission android:name="android.permission.health.READ_TOTAL_CALORIES_BURNED" />
            <uses-permission android:name="android.permission.health.READ_DISTANCE" />
            <uses-permission android:name="android.permission.health.READ_EXERCISE" />
            <uses-permission android:name="android.permission.health.READ_EXERCISE_ROUTE" />
            <uses-permission android:name="android.permission.health.READ_HEART_RATE" />
            <uses-permission android:name="android.permission.health.READ_SLEEP" />
            <uses-permission android:name="android.permission.health.READ_OXYGEN_SATURATION" />

            <!-- непрерывная геолокация -->
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

            <!-- «вопрос дня» -->
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
        '''

        changed = False
        if "near:components" not in m:
            m = m.replace("</application>", COMPONENTS + "    </application>", 1)
            changed = True
        if "near:permissions" not in m:
            m = m.replace("</manifest>", PERMISSIONS + "</manifest>", 1)
            changed = True
        if changed:
            io.open(mpath, "w", encoding="utf-8").write(m)
            print("AndroidManifest.xml пропатчен")
        else:
            print("AndroidManifest.xml уже настроен")

        # ---------- 2) версии инструментов ----------
        vpath = "android/variables.gradle"
        v = io.open(vpath, encoding="utf-8").read()
        v = re.sub(r"minSdkVersion\s*=\s*\d+", "minSdkVersion = 26", v)
        v = re.sub(r"compileSdkVersion\s*=\s*\d+", "compileSdkVersion = 36", v)
        v = re.sub(r"targetSdkVersion\s*=\s*\d+", "targetSdkVersion = 36", v)
        io.open(vpath, "w", encoding="utf-8").write(v)
        print("variables.gradle:", [l for l in v.splitlines() if "SdkVersion" in l])

        bpath = "android/build.gradle"
        b = io.open(bpath, encoding="utf-8").read()
        b = re.sub(r"com\.android\.tools\.build:gradle:[0-9.]+", "com.android.tools.build:gradle:8.9.1", b)
        io.open(bpath, "w", encoding="utf-8").write(b)

        wpath = "android/gradle/wrapper/gradle-wrapper.properties"
        w = io.open(wpath, encoding="utf-8").read()
        w = re.sub(r"gradle-[0-9.]+-(all|bin)\.zip", "gradle-8.11.1-all.zip", w)
        io.open(wpath, "w", encoding="utf-8").write(w)

        # ---------- 3) два бага в чужом плагине capacitor-health ----------
        #    (а) опечатка dataOriginsFilter -> dataOriginFilter
        #    (б) suspend-функция hasPermission вызывается из обычного контекста
        fixed = 0
        decl = "private suspend fun hasPermission(p: CapHealthPermission): Boolean {"
        wrap = ("private fun hasPermission(p: CapHealthPermission): Boolean = "
                "kotlinx.coroutines.runBlocking { hasPermissionSuspend(p) }\n\n"
                "    private suspend fun hasPermissionSuspend(p: CapHealthPermission): Boolean {")
        for f in glob.glob("node_modules/capacitor-health/android/src/main/**/*.kt", recursive=True):
            t = io.open(f, encoding="utf-8").read()
            orig = t
            t = t.replace("dataOriginsFilter", "dataOriginFilter")
            if decl in t and "hasPermissionSuspend" not in t:
                t = t.replace(decl, wrap)
            if t != orig:
                io.open(f, "w", encoding="utf-8").write(t)
                fixed += 1
                print("плагин пропатчен:", f)
        print("исправлено файлов плагина:", fixed)
        PY

    - &copy_native
      name: Вложить наши нативные исходники и зарегистрировать плагины
      script: |
        python3 - <<'PY'
        import io, os, re, glob, shutil

        PKG = "com.fit_up.health.capacitor"
        FILES = ["NearSleepPlugin.kt", "NearGeoPlugin.kt", "NearGeoService.kt",
                 "NearCloudPush.kt", "NearBootReceiver.kt"]

        # Кладём рядом с чужим плагином здоровья: в этом модуле уже настроен Kotlin
        # и подключена библиотека Health Connect, отдельная сборка не нужна.
        dirs = [os.path.dirname(f) for f in glob.glob(
            "node_modules/capacitor-health/android/src/main/**/HealthPlugin.kt", recursive=True)]
        if not dirs:
            dirs = [d for d in glob.glob(
                "node_modules/capacitor-health/android/src/main/java/**/", recursive=True)
                if d.rstrip("/").endswith("capacitor")]
        if not dirs:
            raise SystemExit("ОШИБКА: не найден исходный код плагина здоровья")
        dst = dirs[0]
        real_pkg = dst.split("java/")[-1].strip("/").replace("/", ".")
        print("пакет плагина:", real_pkg, "->", dst)

        for name in FILES:
            src = os.path.join("native", "android", name)
            if not os.path.exists(src):
                raise SystemExit("ОШИБКА: нет файла " + src)
            t = io.open(src, encoding="utf-8").read()
            # если у плагина внезапно другой пакет — подставляем настоящий
            t = re.sub(r"^package .*$", "package " + real_pkg, t, count=1, flags=re.M)
            io.open(os.path.join(dst, name), "w", encoding="utf-8").write(t)
            print("вложен", name, len(t), "символов")

        # Манифест ссылается на классы по полному имени — поправим, если пакет другой
        if real_pkg != PKG:
            mpath = "android/app/src/main/AndroidManifest.xml"
            m = io.open(mpath, encoding="utf-8").read()
            m = m.replace(PKG + ".NearGeoService", real_pkg + ".NearGeoService")
            m = m.replace(PKG + ".NearBootReceiver", real_pkg + ".NearBootReceiver")
            io.open(mpath, "w", encoding="utf-8").write(m)
            print("имена классов в манифесте поправлены на", real_pkg)

        # ---------- регистрация плагинов в MainActivity ----------
        mains = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)
        if not mains:
            raise SystemExit("ОШИБКА: MainActivity.java не найден")
        method = ("    @Override\n"
                  "    public void onCreate(android.os.Bundle savedInstanceState) {\n"
                  "        registerPlugin(" + real_pkg + ".NearSleepPlugin.class);\n"
                  "        registerPlugin(" + real_pkg + ".NearGeoPlugin.class);\n"
                  "        super.onCreate(savedInstanceState);\n"
                  "    }\n")
        for mp in mains:
            t = io.open(mp, encoding="utf-8").read()
            if "NearGeoPlugin" in t and "NearSleepPlugin" in t:
                print("MainActivity уже настроен"); continue
            if "onCreate" in t:
                # старая версия регистрировала только сон — переписываем целиком
                t = re.sub(r"\s*@Override\s*\n\s*public void onCreate\([^)]*\)\s*\{.*?\n\s*\}\n",
                           "\n" + method, t, flags=re.S)
                if "NearGeoPlugin" not in t:
                    i = t.rstrip().rfind("}")
                    t = t[:i] + method + t[i:]
            else:
                t2 = re.sub(r"public class MainActivity extends BridgeActivity \{\s*\}",
                            "public class MainActivity extends BridgeActivity {\n" + method + "}", t)
                t = t2 if t2 != t else (t[:t.rstrip().rfind("}")] + method + t[t.rstrip().rfind("}"):])
            io.open(mp, "w", encoding="utf-8").write(t)
            print("MainActivity пропатчен:", mp)
            print(io.open(mp, encoding="utf-8").read())
        PY

    - &sync_and_check
      name: Синхронизировать веб-код и проверить сборку
      script: |
        npx cap sync android
        echo "--- плагины, подключённые к Android ---"
        cat android/capacitor.settings.gradle || true

        M=android/app/src/main/AndroidManifest.xml
        need_manifest() {
          grep -q "$1" $M || { echo "ОШИБКА: в манифесте нет $1"; exit 1; }
        }
        grep -q "capacitor-health" android/capacitor.settings.gradle || { echo 'ОШИБКА: плагин браслета не подключился'; exit 1; }
        need_manifest "READ_STEPS"
        need_manifest "READ_SLEEP"
        need_manifest "READ_OXYGEN_SATURATION"
        need_manifest "READ_HEART_RATE"
        need_manifest "ACCESS_FINE_LOCATION"
        need_manifest "ACCESS_BACKGROUND_LOCATION"
        need_manifest "FOREGROUND_SERVICE_LOCATION"
        need_manifest "NearGeoService"
        need_manifest "NearBootReceiver"

        SRC=$(dirname $(find node_modules/capacitor-health/android/src/main -name 'HealthPlugin.kt' | head -1))
        for f in NearSleepPlugin.kt NearGeoPlugin.kt NearGeoService.kt NearCloudPush.kt NearBootReceiver.kt; do
          test -f "$SRC/$f" || { echo "ОШИБКА: не вложен $f"; exit 1; }
        done
        grep -q "requestAccess" "$SRC/NearSleepPlugin.kt" || { echo 'ОШИБКА: запрос разрешений на сон/SpO2 не добавился'; exit 1; }
        grep -rq "NearSleepPlugin" android/app/src/main/java || { echo 'ОШИБКА: плагин здоровья не зарегистрирован'; exit 1; }
        grep -rq "NearGeoPlugin" android/app/src/main/java || { echo 'ОШИБКА: плагин геолокации не зарегистрирован'; exit 1; }
        echo "проверка пройдена: браслет, сон, пульс, SpO2 и непрерывная геолокация подключены"

workflows:
  android-debug:
    name: Near Android (debug APK)
    max_build_duration: 45
    environment:
      node: 20
      java: 21
    scripts:
      - *install_deps
      - *add_android
      - *patch_android
      - *copy_native
      - *sync_and_check
      - name: Собрать debug APK
        script: |
          chmod +x android/gradlew || true
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - hhzzzd@seznam.cz

  android-release:
    name: Near Android (подписанный AAB для Google Play)
    max_build_duration: 60
    environment:
      node: 20
      java: 21
      groups:
        - near_keystore
    scripts:
      - *install_deps
      - *add_android
      - *patch_android
      - *copy_native
      - *sync_and_check
      - name: Настроить подпись приложения
        script: |
          echo $NEAR_KEYSTORE | base64 --decode > /tmp/near.keystore
          python3 - <<'PY'
          import io, os
          cfg = '''
          android {
              signingConfigs {
                  release {
                      storeFile file("/tmp/near.keystore")
                      storePassword System.getenv("NEAR_KEYSTORE_PASS")
                      keyAlias System.getenv("NEAR_KEY_ALIAS")
                      keyPassword System.getenv("NEAR_KEYSTORE_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          '''
          p = "android/app/build.gradle"
          t = io.open(p, encoding="utf-8").read()
          if "signingConfigs" not in t:
              io.open(p, "a", encoding="utf-8").write(cfg)
              print("подпись добавлена в build.gradle")
          else:
              print("подпись уже настроена")
          PY

      - name: Собрать подписанный AAB для Google Play
        script: |
          chmod +x android/gradlew || true
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/**/*.aab
    publishing:
      email:
        recipients:
          - hhzzzd@seznam.cz
